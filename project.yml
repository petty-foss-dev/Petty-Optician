name: PettyOptician
options:
  bundleIdPrefix: com.isaaclamb
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    MARKETING_VERSION: "1.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PettyOptician:
    type: application
    platform: iOS
    sources:
      - path: PettyOptician
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaaclamb.PettyOptician
        DEVELOPMENT_TEAM: 9TT6DBK8W3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "petty: Optician"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - PettyOpticianTests
  PettyOpticianTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PettyOpticianTests
    dependencies:
      - target: PettyOptician
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaaclamb.PettyOpticianTests
        DEVELOPMENT_TEAM: 9TT6DBK8W3
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
